name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval -- --offline
      - run: npm run build
      - name: End-to-end test in Chromium
        run: |
          npx playwright-core install --with-deps chromium
          npm run e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: bilibilidry-extension
          path: release/*.zip
